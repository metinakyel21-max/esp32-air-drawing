; Build & flash the firmware:   pio run -t upload
; Serial monitor:               pio device monitor
; (Arduino IDE users: open firmware/AirDrawing/AirDrawing.ino instead.)
;
; Wires on other pins? Create local.ini next to this file (it is git-ignored):
;   [env:esp32s3]
;   build_flags = -DAIR_SDA_PIN=4 -DAIR_SCL_PIN=5
[platformio]
src_dir = firmware/AirDrawing
extra_configs = local*.ini

[env:esp32s3]
platform = espressif32@7.1.2
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
